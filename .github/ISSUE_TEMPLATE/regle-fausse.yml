name: Règle fausse ou mal lue
description: Le skill cite ou applique mal une règle du PLUi.
labels: [regle]
body:
  - type: markdown
    attributes:
      value: "**Ne publiez pas votre adresse.** Le code de zone et l'article suffisent."
  - type: input
    id: zone
    attributes: { label: Code de zone, placeholder: URs2f9 }
    validations: { required: true }
  - type: input
    id: article
    attributes: { label: Article et page du règlement, placeholder: "U 9, page 71" }
    validations: { required: true }
  - type: textarea
    id: ecart
    attributes: { label: Ce que dit le skill et ce que dit le règlement }
    validations: { required: true }
