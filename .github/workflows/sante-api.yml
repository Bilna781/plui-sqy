name: Santé des API
on:
  schedule: [{ cron: "0 5 * * 1" }]   # chaque lundi
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  autotest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Autotest sur un lieu public, puis témoins privés (secret)
        env: { PLUI_TEMOINS: "${{ secrets.PLUI_TEMOINS }}" }
        run: uv run plugins/plui-sqy/skills/plui/scripts/parcelle.py --selftest --out /tmp/fiches
      - name: Ouvrir une issue si l'autotest échoue
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue list --label api --state open --search "Autotest en échec" --json number --jq length | grep -q '^0$' &&
          gh issue create --label api --title "Autotest en échec : une API a peut-être changé" \
            --body "Voir l'exécution : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
